# =============================================================================
# CHORE QUEST
# Gamified household chores PWA
# Services: db, backend, frontend, mailhog
# =============================================================================

services:

  # --- Chore Quest: Database ---
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chorequest

  # --- Chore Quest: Backend (FastAPI) ---
  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      SECRET_KEY: ${SECRET_KEY}
      APP_ENV: ${APP_ENV}
      FRONTEND_URL: ${FRONTEND_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=1777
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - chorequest

  # --- Chore Quest: Frontend (SvelteKit) ---
  frontend:
    build: 
        context: ./frontend
        dockerfile: Dockerfile.prod
        args: 
            VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/log/nginx:uid=101,gid=101,mode=0755
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - chorequest

volumes:
  postgres_data:

networks:
  chorequest:
    name: chorequest
    driver: bridge

